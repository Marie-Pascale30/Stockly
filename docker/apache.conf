<VirtualHost *:${PORT}>
    # URL publique (dérivée de APP_URL par l'entrypoint, ex. https://stockly-fpaw.onrender.com:443).
    # Sans elle, Apache construit ses redirections avec le port interne (http://…:10000/).
    ServerName ${SERVER_URL}
    UseCanonicalName On

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # En-têtes de sécurité (toutes les réponses, y compris les erreurs)
    # ------------------------------------------------------------------
    # CSP stricte : aucun script inline ni tiers (polices et Chart.js sont auto-hébergés).
    # 'unsafe-inline' n'est accordé qu'aux styles (attributs style="" générés par la SPA).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always set X-Frame-Options "DENY"
    # L'API pose aussi nosniff : on retire sa copie pour n'envoyer l'en-tête qu'une fois.
    Header unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always unset X-Powered-By
    Header unset X-Powered-By

    # Fichiers statiques : revalidés à chaque visite (ETag), pour ne jamais servir un ancien module JS.
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
